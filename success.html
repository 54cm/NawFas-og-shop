  <style>
    :root {
      --bg: #07060b;
      --surface: #131019;
      --border: #292033;
      --text: #f8f4ff;
      --muted: #948da3;
      --accent: #b25cf5;
      --accent-2: #f254a3;
      --green: #4fd6b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        radial-gradient(circle at 50% 30%, rgba(178,92,245,.12), transparent 40%),
        #07060b;

      color: var(--text);
      font-family: Inter, sans-serif;
    }

    .card {
      width: min(520px, 100%);
      text-align: center;

      padding: 45px 30px;

      background: rgba(19,16,25,.95);
      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow:
        0 20px 70px rgba(0,0,0,.4),
        0 0 40px rgba(178,92,245,.08);
    }

    .check {
      width: 70px;
      height: 70px;

      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(79,214,181,.1);
      border: 2px solid var(--green);

      color: var(--green);
      font-size: 32px;

      box-shadow:
        0 0 25px rgba(79,214,181,.2);
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 32px;
      margin-bottom: 15px;
    }

    .success {
      color: var(--green);
    }

    p {
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .contact {
      margin: 25px 0;
      padding: 18px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: rgba(7,6,11,.5);
    }

    .contact strong {
      display: block;
      margin-bottom: 8px;
      color: white;
    }

    .contact span {
      font-family: "IBM Plex Mono", monospace;
      color: #d99aff;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 9px;

      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;

      background: linear-gradient(
        100deg,
        var(--accent),
        var(--accent-2)
      );

      transition: .2s;
    }

    a:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    a.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    a.secondary:hover {
      color: white;
      border-color: #4c3768;
    }
  </style>
</head>
